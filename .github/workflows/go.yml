name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: stable

    - name: gofmt
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "Files need gofmt:"
          echo "$unformatted"
          exit 1
        fi

    # The structtag analyzer is disabled: participle grammar tags
    # (internal/grammar) aren't key:"value" pairs by design.
    - name: go vet
      run: go vet -structtag=false ./...

    - name: go mod tidy
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.21.x is the minimum version declared in go.mod.
        go: [ '1.21.x', 'stable' ]
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - name: Verify modules
      run: go mod verify

    - name: Build
      run: go build ./...

    # sigmac pulls in Windows-only code through the evtx parser.
    - name: Build sigmac for Windows
      run: GOOS=windows go build -o /dev/null ./sigmac

    - name: Test
      run: go test -race ./...
